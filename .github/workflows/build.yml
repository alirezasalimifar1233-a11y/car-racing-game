name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip curl openjdk-17-jdk \
        python3-pip python3-venv \
        autoconf libtool pkg-config \
        zlib1g-dev libncurses-dev libtinfo6 \
        cmake libffi-dev libssl-dev \
        automake autopoint gettext

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Android SDK command-line tools
    run: |
      SDK="$HOME/.buildozer/android/platform/android-sdk"
      mkdir -p /tmp/android-tools "$SDK/cmdline-tools/latest" "$SDK/tools/bin"
      curl -fL \
        https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
        -o /tmp/android-tools.zip
      unzip -q /tmp/android-tools.zip -d /tmp/android-tools
      cp -a /tmp/android-tools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
      ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
      chmod +x "$SDK/cmdline-tools/latest/bin/"*

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip setuptools wheel
      python -m pip install buildozer cython==0.29.34

  - name: Accept Android SDK licenses
    env:
      ANDROID_HOME: ${{ runner.home }}/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/platform/android-sdk
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

  - name: Build APK
    env:
      BUILDOZER_WARN_ON_ROOT: '0'
      ANDROID_HOME: ${{ runner.home }}/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/platform/android-sdk
    run: buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: car-racing-apk
      path: bin/*.apk
      if-no-files-found: error
