name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            python3-venv autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            \~/.buildozer
            .buildozer
          key: \( {{ runner.os }}-buildozer- \){{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Accept Android SDK licenses (strong method)
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $HOME/.android

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $HOME/.buildozer/android/platform/android-sdk/licenses/google-gdk-license

          yes | sdkmanager --licenses || true

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: |
          # اول یک بار اجرا می‌کنیم تا SDK دانلود شود
          buildozer android debug || true

          # لایسنس‌ها را دوباره قبول می‌کنیم
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

          # بیلد اصلی
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-racing-apk
          path: bin/*.apk
          if-no-files-found: error
